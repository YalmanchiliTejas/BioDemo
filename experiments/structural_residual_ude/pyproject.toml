[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biocore-method-a-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.5,<3", "torchode==1.0.1", "safetensors>=0.4,<1", "numpy>=1.26,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
