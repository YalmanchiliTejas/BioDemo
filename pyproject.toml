[project]
name = "biopharma-factory-benchmark"
version = "0.1.0"
description = "Deterministic benchmark for biopharma factory operating models"
requires-python = ">=3.11"

[project.optional-dependencies]
manufacturing-data = [
    "pydantic>=2,<3", "duckdb>=1.2,<2", "polars>=1,<2",
    "openpyxl>=3.1,<4", "pint>=0.24,<1", "pandera[polars]>=0.24,<1",
    "pypdf>=5,<7", "Pillow>=10,<13", "cocoindex>=1,<2",
    "pypdfium2>=4.30,<5",
]
manufacturing-documents = ["docling>=2,<3"]
benchmarks = [
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "pypdf>=5,<7",
    "Pillow>=12,<13",
]
knowledge = [
    "boto3>=1.35,<2",
    "neo4j>=5.20,<7",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.7,<5",
]
semantic = [
    "fastembed>=0.4,<1",
    "qdrant-client>=1.12,<2",
]
eventbus = [
    "confluent-kafka>=2.5,<3",
]
documents = [
    "pillow>=10,<13",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "pytesseract>=0.3.13,<1",
]
app = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["benchmark*", "src*"]

[tool.setuptools.package-data]
"benchmark.application" = ["static/*"]
"benchmark.incident_demo" = ["data/*.json"]
"benchmark.pharma_simulation" = ["data/*", "artifacts/*", "artifacts/csv/*", "*.md"]
