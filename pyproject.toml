[project]
name = "biopharma-factory-benchmark"
version = "0.1.0"
description = "Deterministic benchmark for biopharma factory operating models"
requires-python = ">=3.11"

[project.optional-dependencies]
knowledge = [
    "boto3>=1.35,<2",
    "neo4j>=5.20,<7",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.7,<5",
]
semantic = [
    "fastembed>=0.4,<1",
    "qdrant-client>=1.12,<2",
]
eventbus = [
    "confluent-kafka>=2.5,<3",
]
documents = [
    "pillow>=10,<13",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "pytesseract>=0.3.13,<1",
]

[tool.setuptools.packages.find]
include = ["benchmark*"]
