<g><title>frontend/components/process/EngineeringChat.tsx</title><rect x="60" y="250" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="78" y="279" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">People and workspace UI</text>
<text x="78" y="310" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Questions, source inspection, forecasts, investigation</text>
<text x="78" y="332" font-family="Arial,sans-serif" font-size="15" fill="#294c50">review and owner controls. Browser uses the platform API.</text>
</g>
<g><title>backend/src/lifesci/api.py; backend/src/lifesci/identity.py; backend/src/lifesci/capabilities.py</title><rect x="640" y="250" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="658" y="279" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Platform API and identity</text>
<text x="658" y="310" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Authenticated tenant/site/owner context. Authorize each</text>
<text x="658" y="332" font-family="Arial,sans-serif" font-size="15" fill="#294c50">read and operation; enforce capability packs and</text>
<text x="658" y="354" font-family="Arial,sans-serif" font-size="15" fill="#294c50">entitlements.</text>
</g>
<g><title>backend/src/lifesci/store.py; backend/src/lifesci/container.py</title><rect x="1220" y="250" width="500" height="190" rx="9" fill="#edf3fc" stroke="#5277a7" stroke-width="1.5"/>
<text x="1238" y="279" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Platform record store</text>
<text x="1238" y="310" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Conversations, mission state, evidence revisions,</text>
<text x="1238" y="332" font-family="Arial,sans-serif" font-size="15" fill="#294c50">proposals, signatures and run history. SQLite or</text>
<text x="1238" y="354" font-family="Arial,sans-serif" font-size="15" fill="#294c50">PostgreSQL configuration.</text>
</g>
<g><title>backend/src/lifesci/process_engineering/conversation.py; backend/src/lifesci/process_engineering/tool_loop.py</title><rect x="60" y="505" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="78" y="534" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Interactive workspace assistant</text>
<text x="78" y="565" font-family="Arial,sans-serif" font-size="15" fill="#294c50">EngineeringConversationService chooses native tool</text>
<text x="78" y="587" font-family="Arial,sans-serif" font-size="15" fill="#294c50">calling or the typed workflow planner. Both retain</text>
<text x="78" y="609" font-family="Arial,sans-serif" font-size="15" fill="#294c50">checkpoints and source checks.</text>
</g>
<g><title>backend/src/lifesci/missions.py</title><rect x="640" y="505" width="500" height="190" rx="9" fill="#edf3fc" stroke="#5277a7" stroke-width="1.5"/>
<text x="658" y="534" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Durable manufacturing missions</text>
<text x="658" y="565" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Owner, objective, constraints, corrections, events,</text>
<text x="658" y="587" font-family="Arial,sans-serif" font-size="15" fill="#294c50">obligations, decisions and lease-fenced activations</text>
<text x="658" y="609" font-family="Arial,sans-serif" font-size="15" fill="#294c50">survive model sessions.</text>
</g>
<g><title>backend/src/lifesci/runtime.py; backend/src/lifesci/workqueue.py</title><rect x="1220" y="505" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="1238" y="534" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Background runtime</text>
<text x="1238" y="565" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Commit notifications + recovery tick deliver subscribed</text>
<text x="1238" y="587" font-family="Arial,sans-serif" font-size="15" fill="#294c50">events. WorkQueue resumes turns; due obligations wake</text>
<text x="1238" y="609" font-family="Arial,sans-serif" font-size="15" fill="#294c50">missions.</text>
</g>
<g><title>backend/src/lifesci/gateway/gateway.py; backend/src/lifesci/gateway/router.py</title><rect x="60" y="760" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="78" y="789" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Model gateway</text>
<text x="78" y="820" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Task routing, provider adapters, qualification policy,</text>
<text x="78" y="842" font-family="Arial,sans-serif" font-size="15" fill="#294c50">budget reservations, usage and run ledger. Deterministic</text>
<text x="78" y="864" font-family="Arial,sans-serif" font-size="15" fill="#294c50">handlers share the boundary.</text>
</g>
<g><title>backend/src/lifesci/investigations.py</title><rect x="640" y="760" width="500" height="190" rx="9" fill="#fff6e7" stroke="#b17a24" stroke-width="1.5"/>
<text x="658" y="789" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Investigation service</text>
<text x="658" y="820" font-family="Arial,sans-serif" font-size="15" fill="#294c50">A person starts a permitted run. Freeze an authorized</text>
<text x="658" y="842" font-family="Arial,sans-serif" font-size="15" fill="#294c50">evidence snapshot; submit a separate executor job and</text>
<text x="658" y="864" font-family="Arial,sans-serif" font-size="15" fill="#294c50">synchronize progress/report.</text>
</g>
<g><title>backend/src/cloud_backend/api.py; backend/src/cloud_backend/dispatcher.py; backend/src/cloud_backend/agent.py</title><rect x="1220" y="760" width="500" height="190" rx="9" fill="#fff6e7" stroke="#b17a24" stroke-width="1.5"/>
<text x="1238" y="789" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Separate investigation executor</text>
<text x="1238" y="820" font-family="Arial,sans-serif" font-size="15" fill="#294c50">cloud_backend API + dispatcher + isolated Docker attempt.</text>
<text x="1238" y="842" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Prime lead and child agents execute against the snapshot.</text>
<text x="1238" y="864" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Requires configuration.</text>
</g>
<g><title>backend/src/lifesci/process_engineering/workspace.py; backend/src/lifesci/process_engineering/conversation.py</title><rect x="60" y="1015" width="500" height="190" rx="9" fill="#edf7f4" stroke="#26756b" stroke-width="1.5"/>
<text x="78" y="1044" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Registered scientific/workspace tools</text>
<text x="78" y="1075" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Discover records, inspect originals, find links, compare</text>
<text x="78" y="1097" font-family="Arial,sans-serif" font-size="15" fill="#294c50">cases, simulate and fit models. Host validates</text>
<text x="78" y="1119" font-family="Arial,sans-serif" font-size="15" fill="#294c50">permissions and tool payloads.</text>
</g>
<g><title>backend/src/lifesci/evidence.py; backend/src/lifesci/process_engineering/grounding.py</title><rect x="640" y="1015" width="500" height="190" rx="9" fill="#edf3fc" stroke="#5277a7" stroke-width="1.5"/>
<text x="658" y="1044" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Evidence and outputs</text>
<text x="658" y="1075" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Versioned evidence references, calculated artifacts,</text>
<text x="658" y="1097" font-family="Arial,sans-serif" font-size="15" fill="#294c50">explicit gaps and grounding checks. Source matching is</text>
<text x="658" y="1119" font-family="Arial,sans-serif" font-size="15" fill="#294c50">not semantic or quality validation.</text>
</g>
<g><title>backend/src/lifesci/actions.py; backend/src/lifesci/ownership.py</title><rect x="1220" y="1015" width="500" height="190" rx="9" fill="#f4effa" stroke="#8b6ba5" stroke-width="1.5"/>
<text x="1238" y="1044" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#193a3d">Human review and action boundary</text>
<text x="1238" y="1075" font-family="Arial,sans-serif" font-size="15" fill="#294c50">Recommendations, approval, action intents, delivery</text>
<text x="1238" y="1097" font-family="Arial,sans-serif" font-size="15" fill="#294c50">receipts and outcomes remain separate. Existing systems</text>
<text x="1238" y="1119" font-family="Arial,sans-serif" font-size="15" fill="#294c50">retain their assigned record ownership.</text>
</g>
<text x="60" y="1320" font-family="Arial,sans-serif" font-size="15" fill="#53676f">Implemented in source ≠ enabled in this deployment ≠ validated manufacturing performance. Amber marks configuration-dependent</text>
<text x="60" y="1342" font-family="Arial,sans-serif" font-size="15" fill="#53676f">execution. Blue marks durable data; purple marks human authority.</text>
</svg>