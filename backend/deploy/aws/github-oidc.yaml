AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy the BioDemo API without stored AWS keys. GitHub
  presents a short-lived OIDC token; only workflow jobs in this repository's
  "production" environment can assume the role, and the role can do only what
  the biodemo-lambda-deploy policy allows. Create once, as an administrator.

Parameters:
  Repository:
    Type: String
    Default: YalmanchiliTejas/BioDemo
    Description: GitHub owner/name.
  Environment:
    Type: String
    Default: production
    Description: GitHub environment the deploy job runs in (protect it with required reviewers if you like).
  DeployPolicyName:
    Type: String
    Default: biodemo-lambda-deploy
    Description: The customer managed policy created from deployer-policy.json.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      An account can have only one GitHub OIDC provider. Choose false if IAM →
      Identity providers already lists token.actions.githubusercontent.com.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: biodemo-github-deployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${Environment}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${DeployPolicyName}

Outputs:
  RoleArn:
    Description: Put this in the GitHub variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
