AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  BioDemo platform API on AWS Lambda. One function serves the function URL,
  runs its own background tasks (asynchronous self-invocation) and the
  runtime schedule. Data lives in Supabase (PostgreSQL, Storage, Auth); the
  assistant model runs on Modal. Deploy with deploy/aws/deploy.sh (AWS CLI
  and Docker; no SAM CLI needed).

Parameters:
  ImageUri:
    Type: String
    Description: ECR image (pushed by deploy.sh).
  FunctionName:
    Type: String
    Default: biodemo-api
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Runtime connection as lifesci_app (Supabase session pooler, sslmode=require).
  SupabaseUrl:
    Type: String
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Used only for the private Storage bucket (original files).
  DeploymentTenant:
    Type: String
  CorsOrigins:
    Type: String
    Description: Comma-separated frontend origins, e.g. https://biodemo.vercel.app
  StorageBucket:
    Type: String
    Default: cmo-evidence
  ModalBaseUrl:
    Type: String
    Default: ""
  ModalProxyToken:
    Type: String
    NoEcho: true
    Default: ""
  LlmModel:
    Type: String
    Default: zai-org/GLM-5.3
  InvestigationExecutorUrl:
    Type: String
    Default: ""
    Description: HTTPS base URL of the investigation executor (cloud_backend). Empty disables multi-agent investigations.
  InvestigationExecutorAudience:
    Type: String
    Default: ""
  InvestigationExecutorTenant:
    Type: String
    Default: ""
  InvestigationExecutorProject:
    Type: String
    Default: ""
  InvestigationIssuer:
    Type: String
    Default: ""
    Description: Issuer the executor trusts, e.g. https://api.example.com (JWKS at /.well-known/investigation-jwks.json)
  InvestigationSigningKeySecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN holding the RS256 private key PEM (kept out of the 4 KB Lambda environment)
  InvestigationSigningKeyId:
    Type: String
    Default: investigation-1
  AllowUnqualifiedRoutes:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: >
      1 lets the assistant use the Modal model before a recorded evaluation
      qualifies it; every such answer is flagged for human review.
  SupabaseJwtSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only for Supabase projects still on the legacy shared JWT secret.
  ConnectorCredentialKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      32 random bytes, base64 (openssl rand -base64 32). Encrypts credentials people enter
      for guided data connections. Changing it makes saved credentials unreadable.
  RuntimeSchedule:
    Type: String
    Default: rate(1 minute)
  MemorySize:
    Type: Number
    Default: 3008
    Description: CPU scales with memory; parsing deliveries is CPU-bound.
  MultiTenant:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: Enable account-owned organizations and stored membership selection.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5
    Description: 0 omits the reservation for small account quotas; 1-5 caps concurrent invocations when account headroom permits.
  ApiDomain:
    Type: String
    Default: ""
    Description: Custom API hostname, e.g. api.sievance.com (needs CertificateArn).
  CertificateArn:
    Type: String
    Default: ""
    Description: Issued ACM certificate for ApiDomain, in us-east-1 (CloudFront requires that region).

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, "0"]]
  HasModal: !Not [!Equals [!Ref ModalProxyToken, ""]]
  HasInvestigationKey: !Not [!Equals [!Ref InvestigationSigningKeySecretArn, ""]]
  HasDomain: !And
    - !Not [!Equals [!Ref ApiDomain, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref MemorySize
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Timeout: 900
      EphemeralStorage:
        Size: 4096
      LoggingConfig:
        LogGroup: !Ref Logs
      FunctionUrlConfig:
        AuthType: NONE          # public URL; every request is authenticated by the app (Supabase Auth)
        InvokeMode: BUFFERED
      Environment:
        Variables:
          LIFESCI_MULTI_TENANT: !Ref MultiTenant
          LIFESCI_AUTH_MODE: supabase
          LIFESCI_DATABASE_URL: !Ref DatabaseUrl
          LIFESCI_DB_MIGRATE: "0"
          DEPLOYMENT_TENANT: !Ref DeploymentTenant
          CMO_DEFAULT_TENANT: !Ref DeploymentTenant
          LIFESCI_CORS_ORIGINS: !Ref CorsOrigins
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_JWT_SECRET: !Ref SupabaseJwtSecret
          LIFESCI_CONNECTOR_KEY: !Ref ConnectorCredentialKey
          CMO_STORAGE_BUCKET: !Ref StorageBucket
          LIFESCI_LLM_PROVIDER: !If [HasModal, modal, !Ref AWS::NoValue]
          LIFESCI_LLM_MODEL: !If [HasModal, !Ref LlmModel, !Ref AWS::NoValue]
          MODAL_BASE_URL: !Ref ModalBaseUrl
          MODAL_PROXY_TOKEN: !Ref ModalProxyToken
          LIFESCI_ALLOW_UNQUALIFIED_ROUTES: !Ref AllowUnqualifiedRoutes
          INVESTIGATION_EXECUTOR_URL: !Ref InvestigationExecutorUrl
          INVESTIGATION_EXECUTOR_AUDIENCE: !Ref InvestigationExecutorAudience
          INVESTIGATION_EXECUTOR_TENANT: !Ref InvestigationExecutorTenant
          INVESTIGATION_EXECUTOR_PROJECT: !Ref InvestigationExecutorProject
          INVESTIGATION_ISSUER: !Ref InvestigationIssuer
          INVESTIGATION_SIGNING_KEY_SECRET_ARN: !Ref InvestigationSigningKeySecretArn
          INVESTIGATION_SIGNING_KEY_ID: !Ref InvestigationSigningKeyId
      Policies:
        - Statement:
            - !If
              - HasInvestigationKey
              - Sid: ReadInvestigationSigningKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref InvestigationSigningKeySecretArn
              - !Ref AWS::NoValue
            - Sid: RunOwnBackgroundTasks
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
      Events:
        Runtime:
          Type: Schedule
          Properties:
            Schedule: !Ref RuntimeSchedule
            Input: '{"biodemo_task": {"kind": "runtime_tick", "payload": {}}}'

  # Background tasks are idempotent but not worth retrying blindly: a failed run
  # is recorded as failed and the user starts it again.
  TaskDelivery:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Api
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 30

  # api.<domain> in front of the function URL. Nothing is cached (every
  # response is per-user); the viewer's Host header is not forwarded because
  # the function URL only answers to its own hostname.
  ApiCdn:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ApiDomain} -> ${FunctionName} function URL"
        Aliases: [!Ref ApiDomain]
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

Outputs:
  ApiUrl:
    Description: Set NEXT_PUBLIC_LIFESCI_API_URL in Vercel to this value (without the trailing slash).
    Value: !If [HasDomain, !Sub "https://${ApiDomain}", !GetAtt ApiUrl.FunctionUrl]
  FunctionUrl:
    Description: Direct function URL (also reachable; the app authenticates every request).
    Value: !GetAtt ApiUrl.FunctionUrl
  DnsTarget:
    Condition: HasDomain
    Description: Point a CNAME for ApiDomain at this hostname at your DNS provider.
    Value: !GetAtt ApiCdn.DomainName
