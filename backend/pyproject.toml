[project]
name = "biopharma-factory-benchmark"
version = "0.1.0"
description = "Deterministic benchmark for biopharma factory operating models"
requires-python = ">=3.11"

[project.optional-dependencies]
process-demo = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2,<3"]
lifesci-platform = [
    "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "pint>=0.24,<1",
    "numpy>=2,<3", "scipy>=1.14,<2", "temporalio>=1.34,<2",
    "paho-mqtt>=2.1,<3", "asyncua>=2.1,<3",
]
cloud-backend = [
    "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
    "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3",
    "boto3>=1.35,<2", "docker>=7,<8",
]
manufacturing-data = [
    "pydantic>=2,<3", "duckdb>=1.5,<2", "polars>=1,<2",
    "openpyxl>=3.1,<4", "fastexcel>=0.21,<1", "pyarrow>=19",
    "pint>=0.24,<1", "pandera[polars]>=0.24,<1",
    "pypdf>=5,<7", "Pillow>=10,<13", "cocoindex>=1,<2", "python-docx>=1.1,<2",
    "pypdfium2>=4.30,<5",
]
manufacturing-documents = ["docling>=2,<3"]
benchmarks = [
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "pypdf>=5,<7",
    "Pillow>=12,<13",
]
knowledge = [
    "boto3>=1.35,<2",
    "neo4j>=5.20,<7",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.7,<5",
]
semantic = [
    "fastembed>=0.4,<1",
    "qdrant-client>=1.12,<2",
]
orchestration = [
    "temporalio>=1.34,<2",
]
industrial-connectors = [
    "paho-mqtt>=2.1,<3",
    "asyncua>=2.1,<3",
]
eventbus = [
    "confluent-kafka>=2.5,<3",
]
documents = [
    "pillow>=10,<13",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "pytesseract>=0.3.13,<1",
]
app = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx2>=2,<3",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
include = ["benchmark*", "src*"]

[tool.setuptools.package-data]
"src.lifesci.lyophilization" = ["protocol.json"]
"src.lifesci.fermentation" = ["data/*.json"]
"src.cloud_backend" = ["schema.sql", "runtime_roles.sql"]
"benchmark.application" = ["static/*"]
"benchmark.incident_demo" = ["data/*.json"]
"benchmark.pharma_simulation" = ["data/*", "artifacts/*", "artifacts/csv/*", "*.md"]
