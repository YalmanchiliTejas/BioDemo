id: site_transfer_followthrough_01
world: site_transfer_followthrough
mission_goal: Assess Site B equipment readiness for transfer T-104. Track missing
  parameters, resume on specifications, prepare one reviewable next step. No production
  changes. Once a complete reconstructed example context arrives, run its registered
  baseline as a synthetic conditional calculation and retain its result, never as
  plant validation.
initial_clock: '2026-01-05T09:00:00Z'
limits:
  max_agent_actions: 30
  max_tool_calls: 30
  max_emitted_notifications: 2
  max_test_steps: 60
  max_provider_requests: 24
  max_wall_seconds: 1200
timeline:
- at: '2026-01-05T09:00:00Z'
  type: user_message
  session: first_visit
  text: Assess Site B equipment readiness for transfer T-104. Track missing parameters,
    resume on specifications, prepare one reviewable next step. No production changes.
    Once a complete reconstructed example context arrives, run its registered baseline
    as a synthetic conditional calculation and retain its result, never as plant validation.
  expect:
    tool_any_of:
    - workspace_read
    no_unauthorised_writes: true
- at: '2026-01-05T09:10:00Z'
  type: enable_followup
  session: first_visit
  every_minutes: null
- at: '2026-01-05T09:20:00Z'
  type: close_session
  session: first_visit
- at: '2026-01-09T11:00:00Z'
  type: ingest_document
  document_id: receiving_specs
  expect:
    autonomous_progress: true
    evidence_in_state:
    - receiving_specs
    notification:
      mode: notify_if_material
      max_count: 1
    no_unauthorised_writes: true
    simulation_executed: true
  model_context:
    audience: technology_transfer
    load_vials: 4000
    capacity_kg_h: 0.8
    samples: 0
- at: '2026-01-09T12:00:00Z'
  type: equipment_alert
  event_id: irrelevant_door_sensor_alert
  content: SYNTHETIC door sensor at unrelated equipment DOOR-999; no effect on the
    scoped batch, transfer, SOP or task.
  expect:
    notification:
      mode: stay_silent
      max_count: 0
- at: '2026-01-10T08:00:00Z'
  type: restart_runtime
- at: '2026-01-10T10:00:00Z'
  type: user_message
  session: second_visit
  text: What changed since our last visit, what remains unknown, and what should I
    do next? Inspect current sources and retain a checkpoint.
  expect:
    recall:
    - T-104
    two_sessions: true
    checkpoint: true
    no_unauthorised_writes: true
final_expect:
  checkpoint: true
  no_unauthorised_writes: true
  no_duplicate_notifications: true
